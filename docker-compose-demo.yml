services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: mtl
      POSTGRES_USER: mtluser
      POSTGRES_PASSWORD: MtlSuper123
    ports:
      - "15434:5432"
    expose:
      - 5432
    restart: unless-stopped
    memswap_limit: 512m
    volumes:
      - /volume1/raspberry/MyTrailLogDemo/PostGIS:/var/lib/postgresql/18/docker
    deploy:
      resources:
        limits:
          memory: 512m # 384 MiB validated floor; 20% is 460.8 MiB, rounded to 512 MiB.
        reservations:
          memory: 256m
    command: >
      postgres
      -c shared_buffers=32MB
      -c effective_cache_size=160MB
      -c work_mem=1MB
      -c maintenance_work_mem=16MB
      -c max_connections=20
      -c max_wal_size=1GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=2MB
      -c synchronous_commit=off

  app:
    image: wauwau0977/mytraillog:beta
    pull_policy: always
    depends_on:
      - db
      - location-search
    environment:
      POSTGRES_DB: mtl
      POSTGRES_USER: mtluser
      POSTGRES_PASSWORD: MtlSuper123
      # Demo mode — auto-extracts Porto taxi GPX tracks and generates geo-tagged photos on first startup
      DEMO_MODE: "Y"
      DEMO_TARGET_TRACK_COUNT: "10042"
      DEMO_PHOTO_COUNT: "2000"
      # Deep media trees need many directory watches; demo media uses one subfolder.
      MTL_INDEXER_MEDIA_LIVE_WATCH_ENABLED: "true"
      MTL_PLANNER_BROUTER_TIMEOUT_MS: "310000"
      MTL_LOCATION_SEARCH_STATUS_URL: http://location-search:8083/status
      MTL_LOCATION_SEARCH_QUERY_URL: http://location-search:8083/search
      SERVER_SSL_ENABLED: "false"
    ports:
      - "18084:8080"
    expose:
      - 8080
    restart: unless-stopped
    stop_grace_period: 150s
    memswap_limit: 1024m
    deploy:
      resources:
        limits:
          memory: 1024m # Current demo target after the bounded photo-generation change.
        reservations:
          memory: 512m
    volumes:
      - /volume1/raspberry/MyTrailLogDemo/GPX:/app/gpx
      - /volume1/raspberry/MyTrailLogDemo/media:/app/media
      - /volume1/raspberry/MyTrailLogDemo/logs:/app/logs
      # No application.yml mount — demo credentials (demo/mtl) are baked into application-demo.yml

  map-server:
    # Optional local PMTiles sidecar. Disabled by default; enable with:
    # docker compose --profile local-maps up -d
    # Demo deployments use the hosted PMTiles service unless this profile is enabled.
    profiles: ["local-maps"]
    image: wauwau0977/mytraillog-maps:beta
    pull_policy: always
    ports:
      - "18083:8081"
    expose:
      - 8081
    environment:
      PORT: "8081"
      LOWZOOM_MAXZOOM: "8"
      MAP_DOWNLOAD_URL: latest
    volumes:
      - /volume1/raspberry/MyTrailLogDemo/maps:/data
    restart: unless-stopped
    memswap_limit: 128m
    deploy:
      resources:
        limits:
          memory: 128m # 96 MiB validated floor; 20% is 115.2 MiB, rounded to 128 MiB.
        reservations:
          memory: 64m

  location-search:
    image: wauwau0977/mytraillog-location-search:beta
    pull_policy: always
    expose:
      - 8083
    environment:
      PORT: "8083"
      MTL_LOCATION_SEARCH_DB: /data/geonames-search.sqlite
      MTL_LOCATION_SEARCH_MMAP_SIZE: "33554432"
    restart: unless-stopped
    memswap_limit: 128m
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  brouter:
    image: wauwau0977/mytraillog-brouter:beta
    pull_policy: always
    expose:
      - 17777
      - 17778
    environment:
      BROUTER_JAVA_XMX: "128m"
    volumes:
      - /volume1/raspberry/MyTrailLogDemo/brouter-segments:/segments4
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 192m
    memswap_limit: 512m
    restart: unless-stopped
