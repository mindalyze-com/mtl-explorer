mtl:
  gpx-watch-directory: /app/gpx
  duplicate:
    time-tolerance: PT20M # PT1H (1 hour), PT15M (15 minutes), PT15S (15 seconds)
    distance-tolerance: 1000
  indexer:
    change-detection-strategy: SIZE_AND_MTIME  # SIZE_ONLY | SIZE_AND_MTIME
    worker-threads: 1                     # one file per index at a time keeps large GPX and media imports bounded
    gps:
      live-watch-enabled: true            # watch directory with inotify for instant GPX detection
      rescan-interval: PT12H              # ISO-8601 duration; periodic full rescan interval for GPS
    media:
      live-watch-enabled: false           # disabled: media tree is huge; rely on periodic rescans instead
      rescan-interval: P7D                # ISO-8601 duration; periodic full rescan interval for MEDIA
  denoise:
    algorithm: kalman           # median | kalman  (default: kalman)
    kalman:
      measurement-noise-sigma-horizontal: 6.0   # GPS horizontal std-dev (m); typical 5–8 m
      measurement-noise-sigma-vertical:  10.0   # GPS vertical  std-dev (m); typical 8–12 m
      process-noise-sigma-a:              2.0   # acceleration uncertainty (m/s²); lower = smoother, higher = more responsive
  user:
    # Frontend user for GUI
    login: 'temp'
    password: 'temp.42'
    jwt-expiration: P180D
  exploration:
    corridor-width-m: 25.0                # Buffer radius around each prior path (meters). Known territory.
    use-track-precision: 10               # Simplified track variant to use (10m precision). Which version of the track to take.
    max-tracks-per-run: 20                # Safety cap per scheduler invocation
    worker-threads: 1                     # sequential processing avoids overlapping large track geometries
    run-schedule: PT120S                  # How often the job fires (ISO-8601 duration)
  planner:
    enabled: true                         # Master switch for the route-planner feature. Override via MTL_PLANNER_ENABLED.
    brouter-base-url: http://brouter:17777
    status-url: http://brouter:17778/status
    brouter-timeout-ms: 8000
    profiles:
      - trekking
      - fastbike
      - hiking-mountain
      - car-eco
  demo-mode: false                        # overridden to true by application-demo.yml
  log-viewer-enabled: true               # set to false to disable /api/admin/server-log (always off in demo mode)
  media-watch-directory: /app/media
  media-process:
    max-concurrent-processes: 1   # shared cap for ImageMagick, FFprobe, and FFmpeg child processes
    acquire-timeout: PT0.25S      # fail quickly instead of occupying an HTTP worker behind a long conversion
  video-transcode:
    enabled: true
    temp-directory: ${java.io.tmpdir}/mtl-explorer-video-transcodes
    max-active-sessions: 1       # each active session owns one FFmpeg process
    max-completed-sessions: 1    # bounded reconnect cache; oldest completed output is evicted
    max-sessions: 4              # includes short-lived failed and cancelled status records
    max-session-bytes: 3221225472 # 3 GiB hard per-session output limit
    max-total-bytes: 4294967296   # 4 GiB hard global output limit
    disconnect-grace: PT5M       # active jobs survive brief player disconnects
    completed-expiry: PT30M
    max-runtime: PT6H
    probe-timeout: PT20S
    monitor-interval: PT1S
    segment-seconds: 4
    max-threads: 1               # bounds decoder, filter, and encoder worker memory
  garmin-sync:
    enabled: false # needs to be enabled in custom application.yml
    wrapper-program: /app/garmin_export/run_export.sh
    exclude_activities-file: /app/garmin_export/garmin_exclude_activities.json
    user-name: # needs user-name in custom application.yml
    user-password: # needs password  in custom application.yml
    fit-export-wrapper-program: /app/garmin_fit_export/run_fit_export.sh
    fit-export-save-dir: /app/gpx
    # Tool version management — install scripts are idempotent (skip if venv already present)
    install-gcexport-script: /app/garmin_export/install_gcexport.sh
    install-fit-export-script: /app/garmin_fit_export/install_fit_export.sh
    # Defaults read from Docker ENV (set at build time via ARG); fallback values used in local dev
    gcexport-default-version: ${GCEXPORT_DEFAULT_VERSION:v4.6.2}
    fit-export-default-profile: ${FIT_EXPORT_DEFAULT_PROFILE:default}
    fit-export-default-packages: ${FIT_EXPORT_DEFAULT_PACKAGES:garth fitparse gpxpy}
  db-readonly:
    username: mtluserreadonly
    password: MtlSuper123
    maximum-pool-size: 2
    minimum-idle: 0
  map-server:
    status-url: http://map-server:8081/status
    tile-mode: local                            # "local" = vector tiles from docker-maps, "remote" = raster from internet
    tile-upstream-url: http://map-server:8081   # Docker-internal URL; Java proxy forwards /{scope}/{filename}
    # Hosted PMTiles service for MTL Explorer only, not a general tile service.
    # Normal self-hosted installs should not need to change these values.
    public-upstream-url: https://mtl-maps-public-prod.mindalyze.com
    public-archive-id: public-default           # change when the public PMTiles byte layout changes
    local-archive-id: local-default             # fallback cache key until docker-maps reports its active build id
    local-probe-url:                            # blank = derive from tile-upstream-url + /health
    local-probe-interval-seconds: 20
    local-probe-active-window-seconds: 120
    local-probe-timeout-ms: 800
    upstream-decision-cache-ttl-seconds: 60
    tile-base-url: /mtl/api/map-proxy           # base path returned to client; /prod scope appended dynamically
    tileset-name: planet                        # main tileset filename (without .pmtiles)
    lowzoom-tileset-name: world-lowzoom         # low-zoom extract for offline client cache
    # Remote raster styles used when tile-mode=remote, or as a temporary fallback
    # when local vector tiles are unavailable. Each style needs its own tile URL
    # and matching provider attribution. Override both fields together when using
    # another provider; a deployment that changes only the URL owns any incorrect
    # attribution. This is the intended no-code setup for Simon's use case:
    # OSM Standard for light, OpenTopoMap for topo, and CARTO Dark Matter for dark.
    remote-raster-styles:
      light:
        url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      light-topo:
        url: https://tile.opentopomap.org/{z}/{x}/{y}.png
        attribution: 'Map data: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | Map style: © <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
      dark:
        url: https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>'
  location-search:
    enabled: true
    status-url: ${MTL_LOCATION_SEARCH_STATUS_URL:http://location-search:8083/status}
    query-url: ${MTL_LOCATION_SEARCH_QUERY_URL:http://location-search:8083/search}
    timeout-ms: 1500

server:
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 30
      min-spare: 2
  servlet:
    context-path: "/mtl/"
    # Session config disabled — auth is purely JWT-based (STATELESS session policy).
    # session:
    #   timeout: 31d
    #   cookie:
    #     max-age: 31d
    #     http-only: true
    #     secure: true
    #     same-site: strict
    #     name: mtlwebsession
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: >
      text/html,text/xml,text/plain,text/css,text/javascript,
      application/javascript,application/json,application/geo+json,
      application/xml,image/svg+xml

spring:
  datasource:
    url: jdbc:postgresql://db:5432/mtl
    #url: jdbc:postgresql://diskstation.local:25432/mtl
    username: mtluser
    password: MtlSuper123
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    properties:
      hibernate:
        jdbc.batch_size: 100    # batch inserts/updates into groups of 100 SQL statements
        order_inserts: true     # reorder inserts by type so batching kicks in
        order_updates: true     # same for updates
      #not required with spring boot 3dialect: org.hibernate.spatial.dialect.postgis.PostgisDialect
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
  mvc:
    format:
      date: iso       # seems to be ignored
      date-time: iso  # seems to be ignored
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 205MB
  jackson:
  # custom bean!
  task:
    execution:
      thread-name-prefix: async-
    scheduling:
      thread-name-prefix: sched-
      pool:
        size: 2
  lifecycle:
    timeout-per-shutdown-phase: 2m


logging:
  level:
    org.springframework.web.servlet.resource: INFO
    org.springframework.security: INFO
    com.x8ing.mtl.server.mtlserver.web.filter.RequestHeaderLoggingFilter: INFO
